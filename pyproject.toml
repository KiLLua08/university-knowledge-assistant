
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "university-knowledge-assistant"
version = "0.1.0"
description = "AI-powered university knowledge assistant using document processing and RAG"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "University Knowledge Assistant Project"}
]
keywords = ["ai", "nlp", "education", "rag", "semantic-search"]

dependencies = [
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
]
vector-db = [
    "chromadb>=0.5.0",
]
bigdata = [
    "pyspark>=4.0.0,<5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.4.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.22.0",
]

[project.urls]
Homepage = "https://github.com/KiLLua08/university-knowledge-assistant"
Repository = "https://github.com/KiLLua08/university-knowledge-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
